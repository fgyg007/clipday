name: Build ClipDay Android

on:
  workflow_dispatch:
  push:
    branches: [main, codex/unified-validation]
    paths:
      - 'Android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Android
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Restore ClipDay signing key
        env:
          KEYSTORE: ${{ secrets.CLIPDAY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/clipday.jks"
      - name: Test, lint and build signed APK
        env:
          CLIPDAY_ANDROID_KEYSTORE: ${{ runner.temp }}/clipday.jks
          CLIPDAY_ANDROID_STORE_PASSWORD: ${{ secrets.CLIPDAY_ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CLIPDAY_ANDROID_STORE_PASSWORD"
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon --console=plain
      - name: Verify signature and prepare download
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p ../dist/android
          cp app/build/outputs/apk/release/app-release.apk ../dist/android/ClipDay-0.2.0-preview.3-android.apk
          cd ../dist/android
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: clipday-android-${{ github.sha }}
          path: dist/android/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipday-android-test-reports-${{ github.sha }}
          path: |
            Android/app/build/reports/tests/
            Android/app/build/test-results/
            Android/core/build/reports/tests/
            Android/core/build/test-results/test/
            Android/app/build/reports/lint-results-release.*
          retention-days: 30
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/clipday.jks"
