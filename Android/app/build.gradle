plugins { id 'com.android.application' }
android {
    namespace 'io.jlmac.clipday.android'
    compileSdk 35
    defaultConfig {
        applicationId 'io.jlmac.clipday.android'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.2.0-preview.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            def keyPath = System.getenv('CLIPDAY_ANDROID_KEYSTORE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('CLIPDAY_ANDROID_STORE_PASSWORD')
                keyAlias 'clipday'
                keyPassword System.getenv('CLIPDAY_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    packaging { resources { excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'] } }
}
dependencies {
    implementation project(':core')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
